<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto News Pulse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2322c55e'/><path d='M9 19l5-6 4 4 5-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--bull)"/><path d="M9 19l5-6 4 4 5-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="appName">Crypto News Pulse</span>
    </div>
    <div class="topbar-right">
      <span id="live" class="live"><span class="dot"></span><span id="liveText"></span></span>
      <span id="engine" class="engine"></span>
      <button id="langBtn" class="lang-btn" title="Language / 语言" aria-label="Language / 语言">
        <span data-lang="en">EN</span><span data-lang="zh">中文</span>
      </button>
      <button id="notifyBtn" class="icon-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" data-i18n-title="themeBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="refreshBtn" class="icon-btn" data-i18n-title="refreshBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="cards">
      <article class="card mood-card">
        <h2><span data-i18n="moodTitle">Market mood</span> <span class="muted" data-i18n="moodSub">· 24h, impact-weighted</span></h2>
        <div class="gauge-wrap">
          <svg id="gauge" viewBox="0 0 200 116" role="img" aria-labelledby="moodValue moodLabel"></svg>
          <div class="gauge-readout">
            <div id="moodValue" class="mood-value">—</div>
            <div id="moodLabel" class="mood-label"></div>
            <div id="moodChange" class="mood-change"></div>
          </div>
        </div>
      </article>

      <article class="card trend-card">
        <h2><span data-i18n="trendTitle">Mood trend</span> <span class="muted" data-i18n="trendSub">· last 48h</span></h2>
        <div id="trend" class="trend"></div>
      </article>

      <article class="card split-card">
        <h2><span data-i18n="last24">Last 24h</span> <span id="total24" class="muted"></span></h2>
        <div id="splitBar" class="split-bar" role="img"></div>
        <ul id="splitLegend" class="split-legend"></ul>
        <div id="extremes" class="extremes"></div>
      </article>

      <article class="card coins-card">
        <h2><span data-i18n="byCoin">By coin</span> <span class="muted" data-i18n="byCoinSub">· avg score, 24h</span></h2>
        <ul id="coins" class="coins"></ul>
      </article>
    </section>

    <section class="feed-section">
      <div class="filters">
        <input id="search" type="search" data-i18n-ph="search" data-i18n-aria="search" />
        <div class="seg" role="radiogroup" data-i18n-aria="sentFilter">
          <button data-sent="all" class="active" data-i18n="all">All</button>
          <button data-sent="bull" data-i18n="bullBtn">▲ Bullish</button>
          <button data-sent="neutral" data-i18n="neutralBtn">Neutral</button>
          <button data-sent="bear" data-i18n="bearBtn">▼ Bearish</button>
        </div>
        <select id="source" data-i18n-aria="source"></select>
        <select id="sort" data-i18n-aria="sort">
          <option value="latest" data-i18n="latest">Latest</option>
          <option value="bull" data-i18n="mostBull">Most bullish</option>
          <option value="bear" data-i18n="mostBear">Most bearish</option>
          <option value="impact" data-i18n="movers">Biggest movers</option>
        </select>
        <span id="coinFilter" class="coin-filter" hidden></span>
      </div>

      <button id="newBanner" class="new-banner" hidden></button>
      <ol id="feed" class="feed" aria-live="polite"></ol>
      <button id="moreBtn" class="more-btn" hidden></button>
      <p id="empty" class="empty" hidden data-i18n="empty">No stories match these filters.</p>
    </section>
  </main>

  <footer class="foot">
    <span id="feedHealth"></span>
    <span class="muted" data-i18n="disclaimer">Scores estimate market impact from headlines — not financial advice.</span>
  </footer>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
