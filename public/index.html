<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto News Pulse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2322c55e'/><path d='M9 19l5-6 4 4 5-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--bull)"/><path d="M9 19l5-6 4 4 5-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Crypto News Pulse</span>
    </div>
    <div class="topbar-right">
      <span id="live" class="live" title="Connection status"><span class="dot"></span><span id="liveText">Connecting…</span></span>
      <span id="engine" class="engine" title="Scoring engine"></span>
      <button id="notifyBtn" class="icon-btn" title="Alert me on major market-moving news" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" title="Toggle light/dark theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="refreshBtn" class="icon-btn" title="Fetch news now">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="cards">
      <article class="card mood-card">
        <h2>Market mood <span class="muted">· 24h, impact-weighted</span></h2>
        <div class="gauge-wrap">
          <svg id="gauge" viewBox="0 0 200 116" role="img" aria-labelledby="moodValue moodLabel"></svg>
          <div class="gauge-readout">
            <div id="moodValue" class="mood-value">—</div>
            <div id="moodLabel" class="mood-label">Waiting for data</div>
            <div id="moodChange" class="mood-change"></div>
          </div>
        </div>
      </article>

      <article class="card trend-card">
        <h2>Mood trend <span class="muted">· last 48h</span></h2>
        <div id="trend" class="trend"></div>
      </article>

      <article class="card split-card">
        <h2>Last 24h <span id="total24" class="muted"></span></h2>
        <div id="splitBar" class="split-bar" role="img"></div>
        <ul id="splitLegend" class="split-legend"></ul>
        <div id="extremes" class="extremes"></div>
      </article>

      <article class="card coins-card">
        <h2>By coin <span class="muted">· avg score, 24h</span></h2>
        <ul id="coins" class="coins"></ul>
      </article>
    </section>

    <section class="feed-section">
      <div class="filters">
        <input id="search" type="search" placeholder="Search headlines…" aria-label="Search headlines" />
        <div class="seg" role="radiogroup" aria-label="Sentiment filter">
          <button data-sent="all" class="active">All</button>
          <button data-sent="bull">▲ Bullish</button>
          <button data-sent="neutral">Neutral</button>
          <button data-sent="bear">▼ Bearish</button>
        </div>
        <select id="source" aria-label="Source"><option value="">All sources</option></select>
        <select id="sort" aria-label="Sort">
          <option value="latest">Latest</option>
          <option value="bull">Most bullish</option>
          <option value="bear">Most bearish</option>
          <option value="impact">Biggest movers</option>
        </select>
        <span id="coinFilter" class="coin-filter" hidden></span>
      </div>

      <button id="newBanner" class="new-banner" hidden></button>
      <ol id="feed" class="feed" aria-live="polite"></ol>
      <button id="moreBtn" class="more-btn" hidden>Show more</button>
      <p id="empty" class="empty" hidden>No stories match these filters.</p>
    </section>
  </main>

  <footer class="foot">
    <span id="feedHealth"></span>
    <span class="muted">Scores estimate market impact from headlines — not financial advice.</span>
  </footer>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
